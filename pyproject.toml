[project]
name = "long-context-recall"
version = "0.1.0"
description = "How well do LLMs use long context? Recall of planted fictional facts by context length, position, distractors and two-hop composition, on local open models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.scripts]
lcrecall = "lcrecall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcrecall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
